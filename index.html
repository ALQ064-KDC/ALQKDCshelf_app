<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>棚番・商品コード検索</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --ink: #24272B;
    --ink-soft: #6B7076;
    --line: #E1DED6;
    --accent: #1F5B4C;
    --accent-soft: #E5EEEA;
    --warn: #A6432B;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 60px; }
  header { padding: 18px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  header h1 { font-size: 19px; margin: 0 0 2px; }
  header p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--ink-soft); }

  #reader {
    position:relative;
    width:100%;
    height:clamp(220px, 62vw, 340px);
    border-radius:8px;
    overflow:hidden;
    background:#111;
  }
  #reader video, #reader canvas {
    width:100% !important;
    height:100% !important;
    object-fit:cover;
  }
  #reader .ocr-guide {
    position:absolute;
    z-index:10;
    left:3%;
    right:3%;
    top:50%;
    height:30%;
    transform:translateY(-50%);
    border:3px solid rgba(255,255,255,.92);
    border-radius:8px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.24);
    pointer-events:none;
  }
  #reader .ocr-guide-label {
    position:absolute;
    z-index:11;
    left:0; right:0;
    top:calc(50% + 17%);
    transform:translateY(-50%);
    text-align:center;
    color:#fff;
    font-size:12px;
    font-weight:600;
    text-shadow:0 1px 3px #000;
    pointer-events:none;
  }

  .field { margin-bottom: 10px; }
  .field label { display:block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input[type=text] {
    width: 100%; padding: 10px 11px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #FCFBF9; color: var(--ink);
  }

  button {
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    border: none; border-radius: 8px; padding: 12px 14px;
    cursor: pointer; width: 100%;
  }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); width:auto; padding:6px 10px; font-size:12px; }

  .status { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; min-height: 16px; }
  .status.busy { color: var(--accent); }
  .status.err { color: var(--warn); }

  .result { margin-top: 6px; }
  .result-row {
    display:flex; justify-content: space-between; align-items:center;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
  }
  .result-row:last-child { border-bottom: none; }
  .result-label { font-size: 12.5px; color: var(--ink-soft); }
  .result-value { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .not-found { color: var(--warn); font-size: 14px; padding: 10px 4px; }

  .gear-row { display:flex; justify-content: flex-end; margin-bottom: 8px; }

  dialog { border:none; border-radius: 12px; padding:0; width: 92%; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  .dialog-inner { padding: 18px; }
  .dialog-inner h3 { margin-top:0; font-size:15px; }
  .dialog-inner p { font-size: 12.5px; color: var(--ink-soft); line-height:1.5; }
  .dialog-actions { display:flex; gap:8px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="gear-row">
    <button class="btn-ghost" id="openSettings">検索先の設定</button>
  </div>

  <header>
    <h1>棚番・商品コード検索</h1>
    <p>JANコードを読み取ると、棚番と自社商品コードを表示します</p>
  </header>

  <div class="panel">
    <h2>カメラでJANコードを読み取る</h2>
    <div id="reader">
      <div class="ocr-guide"></div>
      <div class="ocr-guide-label">JANコードを枠いっぱいに合わせてください</div>
    </div>
    <canvas id="ocrCanvas" style="display:none;"></canvas>
    <button class="btn-secondary" id="restartScan" style="margin-top:10px;">再スキャン</button>
    <div class="status" id="scanStatus">カメラの起動を待っています…</div>
    <div class="status" id="ocrText">JANコードの数字を認識します</div>
  </div>

  <div class="panel">
    <h2>手入力で検索</h2>
    <div class="field">
      <label>JANコード / ケースJANコード / 商品コード</label>
      <input type="text" id="janInput" inputmode="numeric" placeholder="コードを入力">
    </div>
    <button class="btn-secondary" id="searchBtn">検索</button>
  </div>

  <div class="panel">
    <h2>検索結果</h2>
    <div id="resultArea"><p class="status">JANコードを読み取ると自動で検索します</p></div>
  </div>

  <div class="panel">
    <h2>メモを送信</h2>
    <div class="field">
      <label>入力内容(現在表示中のJANコードと一緒に送信されます)</label>
      <input type="text" id="noteInput" placeholder="メモや報告内容を入力">
    </div>
    <button class="btn-secondary" id="sendNoteBtn">送信</button>
    <div class="status" id="noteStatus"></div>
  </div>

</div>

<dialog id="settingsDialog">
  <div class="dialog-inner">
    <h3>検索先(Apps Script)の設定</h3>
    <p>Google Apps ScriptのウェブアプリURLを貼り付けるか、URLが書かれたテキストファイルを選択してください。このスマホ/ブラウザに保存されます。</p>
    <div class="field">
      <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec">
    </div>
    <div class="field">
      <label>または、URLが書かれた.txtファイルを選択</label>
      <input type="file" id="urlFileInput" accept=".txt,text/plain">
    </div>
    <div class="field">
      <label>アクセスキー(Apps Script側と同じ文字列を設定してください)</label>
      <input type="text" id="accessKeyInput" placeholder="例: alqit-2026">
    </div>
    <div class="status" id="settingsStatus"></div>
    <div class="dialog-actions">
      <button class="btn-ghost" id="closeSettings">閉じる</button>
      <button class="btn-secondary" id="saveSettings">保存</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  const $ = (id) => document.getElementById(id);
  const janInput = $("janInput");
  const scanStatus = $("scanStatus");
  const resultArea = $("resultArea");

  let html5Qr = null;
  let lastLookedUp = "";
  let lastProductCode = "";

  // ---------- settings ----------
  const SETTINGS_KEY = "lookupApp.scriptUrl";
  const ACCESS_KEY_STORAGE = "lookupApp.accessKey";
  const getScriptUrl = () => localStorage.getItem(SETTINGS_KEY) || "";
  const setScriptUrl = (v) => localStorage.setItem(SETTINGS_KEY, v);
  const getAccessKey = () => localStorage.getItem(ACCESS_KEY_STORAGE) || "";
  const setAccessKey = (v) => localStorage.setItem(ACCESS_KEY_STORAGE, v);

  $("openSettings").addEventListener("click", () => {
    $("scriptUrlInput").value = getScriptUrl();
    $("urlFileInput").value = "";
    $("accessKeyInput").value = getAccessKey();
    $("settingsStatus").textContent = "";
    $("settingsDialog").showModal();
  });
  $("closeSettings").addEventListener("click", () => $("settingsDialog").close());
  $("saveSettings").addEventListener("click", () => {
    setScriptUrl($("scriptUrlInput").value.trim());
    setAccessKey($("accessKeyInput").value.trim());
    $("settingsDialog").close();
  });

  // テキストファイルからURLを読み込む(1行目のテキストをそのまま使う)
  $("urlFileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    const settingsStatus = $("settingsStatus");
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result || "").trim().split(/\r?\n/)[0].trim();
      if (!url) {
        settingsStatus.textContent = "ファイルからURLを読み取れませんでした";
        settingsStatus.className = "status err";
        return;
      }
      $("scriptUrlInput").value = url;
      settingsStatus.textContent = "ファイルから読み込みました。「保存」を押してください";
      settingsStatus.className = "status";
    };
    reader.onerror = () => {
      settingsStatus.textContent = "ファイルの読み込みに失敗しました";
      settingsStatus.className = "status err";
    };
    reader.readAsText(file);
  });

  // ---------- 読み取り完了音 ----------
  let audioCtx = null;
  // iOSはユーザー操作なしで音を鳴らせないため、画面タップ時に一度だけ準備しておく
  document.addEventListener("touchend", primeAudio, { once: true });
  document.addEventListener("click", primeAudio, { once: true });
  function primeAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function playBeep(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 2400;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.005);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.09);
    } catch (err) {
      // 音が出せない環境では無視する
    }
  }

  // ---------- scanner ----------
  let html5Qr = null;
  let ocrWorker = null;
  let ocrReady = false;
  let ocrBusy = false;
  let ocrTimer = null;

  function isValidJAN(code){
    if (!/^\d{13}$/.test(code)) return false;
    let sum = 0;
    for(let i=0;i<12;i++){
      const n = Number(code[i]);
      sum += (i % 2 === 0) ? n : n * 3;
    }
    return ((10 - (sum % 10)) % 10) === Number(code[12]);
  }

  function normalizeOCR(s){
    return String(s || "")
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xfee0))
      .replace(/[OoQ]/g,"0")
      .replace(/[Il|]/g,"1")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/[^0-9]/g,"");
  }

  function findJAN(s){
    const d = normalizeOCR(s);
    for(let i=0;i<=d.length-13;i++){
      const c=d.slice(i,i+13);
      if(isValidJAN(c)) return c;
    }
    return "";
  }

  async function initOCR(){
    if(ocrReady) return true;
    try{
      $("ocrText").textContent = "文字認識エンジンを準備しています…";
      ocrWorker = await Tesseract.createWorker("eng");
      await ocrWorker.setParameters({
        tessedit_char_whitelist:"0123456789",
        tessedit_pageseg_mode:"7"
      });
      ocrReady = true;
      $("ocrText").textContent = "JANコードの数字を認識します";
      return true;
    }catch(e){
      $("ocrText").textContent = "文字認識エンジンを準備できませんでした";
      return false;
    }
  }

  async function recognizeJANFromVideo(){
    if(ocrBusy || !html5Qr) return;

    const video = document.querySelector("#reader video");
    if(!video || !video.videoWidth || !video.videoHeight) return;

    ocrBusy = true;
    try{
      const canvas = $("ocrCanvas");
      const sw = video.videoWidth;
      const sh = video.videoHeight;

      // 画面中央の横長ガイド付近をOCR。
      const sx = Math.floor(sw * 0.02);
      const sy = Math.floor(sh * 0.34);
      const sWidth = Math.floor(sw * 0.96);
      const sHeight = Math.floor(sh * 0.32);

      canvas.width = 1600;
      canvas.height = 520;
      const ctx = canvas.getContext("2d", {willReadFrequently:true});
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

      // コントラストを上げる
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      for(let i=0;i<img.data.length;i+=4){
        const g = Math.round(img.data[i]*.299 + img.data[i+1]*.587 + img.data[i+2]*.114);
        const v = g > 145 ? 255 : 0;
        img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v;
      }
      ctx.putImageData(img,0,0);

      const r = await ocrWorker.recognize(canvas);
      const raw = r?.data?.text || "";
      const jan = findJAN(raw);

      if(raw.trim()) $("ocrText").textContent = "文字認識: " + normalizeOCR(raw);

      if(jan && jan !== lastLookedUp){
        janInput.value = jan;
        $("ocrText").textContent = "JAN認識成功: " + jan;
        playBeep();

        if(ocrTimer){ clearInterval(ocrTimer); ocrTimer=null; }
        try{ await html5Qr.stop(); }catch(e){}
        lookup(jan);
      }
    }catch(e){
      // 次のOCRタイミングで再試行
    }finally{
      ocrBusy=false;
    }
  }

  async function startScanner(){
    if(ocrTimer){ clearInterval(ocrTimer); ocrTimer=null; }
    if(html5Qr){
      try{ await html5Qr.stop(); }catch(e){}
    }

    lastLookedUp = "";
    $("ocrText").textContent = "JANコードの数字を認識します";
    scanStatus.textContent = "カメラを起動しています…";
    scanStatus.className = "status busy";

    html5Qr = new Html5Qrcode("reader", {
      verbose:false,
      formatsToSupport:[
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8
      ]
    });

    const config = {
      fps:10,
      qrbox:function(viewWidth, viewHeight){
        return {
          width: Math.floor(viewWidth * 0.94),
          height: Math.min(150, Math.floor(viewHeight * 0.30))
        };
      },
      aspectRatio: 1.7777778,
      disableFlip:true
    };

    const onSuccess = async (decodedText) => {
      const jan = String(decodedText || "").replace(/\D/g,"");
      if(jan && (isValidJAN(jan) || jan.length === 8)){
        janInput.value = jan;
        if(ocrTimer){ clearInterval(ocrTimer); ocrTimer=null; }
        playBeep();
        try{ await html5Qr.stop(); }catch(e){}
        lookup(jan);
      }
    };

    const onError = () => {};

    try{
      // 以前の実装と同じくhtml5-qrcodeでカメラを取得。
      // LINE内ブラウザ/iPhoneでもgetUserMedia直呼びより互換性が高い。
      await html5Qr.start(
        {facingMode:{exact:"environment"}},
        config,
        onSuccess,
        onError
      );
    }catch(e1){
      try{
        await html5Qr.start(
          {facingMode:"environment"},
          config,
          onSuccess,
          onError
        );
      }catch(e2){
        scanStatus.textContent = "カメラを起動できません。LINE内ブラウザの場合は「ブラウザで開く」でお試しください。";
        scanStatus.className = "status err";
        return;
      }
    }

    scanStatus.textContent = "JANコードを枠いっぱいに合わせてください";
    scanStatus.className = "status";

    // カメラ映像が実際に表示されてからOCRを開始。
    const ready = await initOCR();
    if(ready){
      ocrTimer = setInterval(recognizeJANFromVideo, 1200);
    }
  }

  $("restartScan").addEventListener("click", async () => {
    lastLookedUp = "";
    janInput.value = "";
    resultArea.innerHTML = '<p class="status">JANコードを読み取ると自動で検索します</p>';
    await startScanner();
  });

  // 手入力: Enterキー、検索ボタンどちらでも検索できるようにする
  janInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && janInput.value.trim()) {
      lastLookedUp = ""; // 手入力は同じ値でも再検索できるようにする
      lookup(janInput.value.trim());
    }
  });
  $("searchBtn").addEventListener("click", () => {
    const v = janInput.value.trim();
    if (!v) {
      resultArea.innerHTML = '<p class="not-found">JANコードを入力してください</p>';
      return;
    }
    lastLookedUp = "";
    lookup(v);
  });

  // ---------- lookup ----------
  async function lookup(jan){
    const url = getScriptUrl();
    if (!url) {
      resultArea.innerHTML = '<p class="not-found">先に「検索先の設定」からApps ScriptのURLを設定してください</p>';
      return;
    }
    lastLookedUp = jan;
    resultArea.innerHTML = '<p class="status busy">検索しています…</p>';

    try {
      const res = await fetch(url + "?jan=" + encodeURIComponent(jan) + "&key=" + encodeURIComponent(getAccessKey()));
      const data = await res.json();

      if (data.found) {
        lastProductCode = data.productCode || "";
        const shelf2Row = data.shelf2
          ? `<div class="result-row">
               <span class="result-label">棚番2</span>
               <span class="result-value">${escapeHtml(data.shelf2)}</span>
             </div>`
          : "";
        resultArea.innerHTML = `
          <div class="result">
            <div class="result-row">
              <span class="result-label">棚番1</span>
              <span class="result-value">${escapeHtml(data.shelf1 || "-")}</span>
            </div>
            <div class="result-row">
              <span class="result-label">JANコード</span>
              <span class="result-value">${escapeHtml(data.jan || "-")}</span>
            </div>
            <div class="result-row">
              <span class="result-label">商品名</span>
              <span class="result-value">${escapeHtml(data.productName || "-")}</span>
            </div>
            ${shelf2Row}
          </div>`;
        if (html5Qr) {
          try { html5Qr.pause(true); } catch (pauseErr) { /* 既に停止中の場合は無視 */ }
        }
      } else {
        lastProductCode = "";
        const msg = data.error
          ? data.error
          : `JANコード「${jan}」はマスタに見つかりませんでした`;
        resultArea.innerHTML = `<p class="not-found">${escapeHtml(msg)}</p>`;
      }
    } catch (err) {
      const detail = (err && (err.message || err.name)) ? (err.name + ": " + err.message) : String(err);
      resultArea.innerHTML = `<p class="not-found">検索に失敗しました: ${escapeHtml(detail)}</p>`;
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // ---------- メモ送信 ----------
  $("sendNoteBtn").addEventListener("click", async () => {
    const noteStatus = $("noteStatus");
    const url = getScriptUrl();
    const text = $("noteInput").value.trim();

    if (!url) {
      noteStatus.textContent = "先に「検索先の設定」からApps ScriptのURLを設定してください";
      noteStatus.className = "status err";
      return;
    }
    if (!text) {
      noteStatus.textContent = "入力内容が空です";
      noteStatus.className = "status err";
      return;
    }

    noteStatus.textContent = "送信しています…";
    noteStatus.className = "status busy";

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // CORSプリフライトを避けるため
        body: JSON.stringify({
          jan: janInput.value.trim(),
          productCode: lastProductCode,
          text: text,
          timestamp: new Date().toISOString(),
          key: getAccessKey()
        })
      });
      const result = await res.json().catch(() => ({}));
      if (res.ok && result.ok !== false) {
        noteStatus.textContent = "送信しました";
        noteStatus.className = "status";
        $("noteInput").value = "";
      } else {
        throw new Error(result.error || ("HTTPステータス " + res.status));
      }
    } catch (err) {
      noteStatus.textContent = "送信に失敗しました: " + err.message;
      noteStatus.className = "status err";
    }
  });

  startScanner();
})();
</script>
</body>
</html>
